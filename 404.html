<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>404 - Page Not Found | Sohaib Kaidali</title>
    <link rel="canonical" href="https://kaidalisohaib.github.io/">
    <link rel="stylesheet" href="styles/main.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .error-content h1 {
            font-size: 6rem;
            color: var(--first-color);
            margin-bottom: 1rem;
        }
        .error-content h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        .error-content p {
            margin-bottom: 2rem;
            color: var(--text-color-light);
        }
        .error-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            background-color: var(--first-color);
            color: var(--container-color);
            text-decoration: none;
            border-radius: 0.5rem;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: var(--first-color-alt);
        }
        .button--outline {
            background-color: transparent;
            color: var(--first-color);
            border: 2px solid var(--first-color);
        }
        .button--outline:hover {
            background-color: var(--first-color);
            color: var(--container-color);
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-content">
            <h1>404</h1>
            <h2>Page Not Found</h2>
            <p>Sorry, the page you're looking for doesn't exist or has been moved.</p>
            <div class="error-buttons">
                <a href="/" class="button">
                    <i class="fas fa-home"></i>
                    Go Home
                </a>
                <a href="/#projects" class="button button--outline">
                    <i class="fas fa-folder"></i>
                    View Projects
                </a>
                <a href="/#contact" class="button button--outline">
                    <i class="fas fa-envelope"></i>
                    Contact Me
                </a>
            </div>
        </div>
    </div>

    <!-- Structured Data for 404 Page -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "404 - Page Not Found",
        "description": "The requested page could not be found on Sohaib Kaidali's portfolio website.",
        "url": "https://kaidalisohaib.github.io/404.html",
        "mainEntity": {
            "@type": "Person",
            "name": "Sohaib Kaidali",
            "url": "https://kaidalisohaib.github.io"
        }
    }
    </script>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>
</html>
