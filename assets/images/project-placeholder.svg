<svg width="400" height="250" viewBox="0 0 400 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="250" fill="#1a1a1a"/>
  <rect x="1" y="1" width="398" height="248" stroke="#333" stroke-width="2" fill="none"/>
  
  <!-- Loading animation -->
  <g opacity="0.6">
    <circle cx="200" cy="125" r="20" fill="none" stroke="#10b981" stroke-width="3">
      <animate attributeName="stroke-dasharray" values="0 126;63 63;0 126" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;-63;-126" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Project icon -->
  <g opacity="0.4">
    <rect x="170" y="95" width="60" height="40" rx="4" fill="#333"/>
    <rect x="175" y="100" width="50" height="30" rx="2" fill="#10b981" opacity="0.3"/>
    <circle cx="185" cy="110" r="3" fill="#10b981"/>
    <rect x="195" y="107" width="25" height="2" rx="1" fill="#10b981"/>
    <rect x="195" y="113" width="20" height="2" rx="1" fill="#10b981"/>
    <rect x="195" y="119" width="15" height="2" rx="1" fill="#10b981"/>
  </g>
  
  <!-- Loading text -->
  <text x="200" y="170" text-anchor="middle" fill="#666" font-family="system-ui, -apple-system, sans-serif" font-size="14">
    Loading project media...
  </text>
</svg>